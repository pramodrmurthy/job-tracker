[project]
name = "hireabroad-scrapper"
version = "0.1.0"
description = "Find jobs, score them against your resume, draft application emails and track the results."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.156.4",
    "google-api-python-client>=2.201.0",
    "google-auth-oauthlib>=1.5.0",
    "openai>=3.35.1",
    "pypdf>=6.21.1",
    "python-docx>=1.2.0",
    "python-multipart>=0.0.32",
    "sqlalchemy>=2.1.5",
    "uvicorn[standard]>=0.54.0",
]


[dependency-groups]
dev = [
    "httpx>=0.28.1",
    "pytest>=9.1.1",
]
